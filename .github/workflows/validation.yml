name: Validation

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest

      - name: Run validation tests
        run: pytest -q tests

      - name: Run XOR validation
        run: python validation/validate_project.py --runs 3 --seed 42
